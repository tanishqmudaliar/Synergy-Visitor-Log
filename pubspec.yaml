name: synergyvisitorlog
description: "A local-first visitor log Flutter app."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  speech_to_text: ^7.0.0
  shared_preferences: ^2.5.3
  image_cropper: ^9.1.0
  intl: ^0.20.2
  image: ^4.5.4
  google_mlkit_face_detection: ^0.13.1
  sqflite: ^2.4.2
  workmanager: ^0.9.0+3
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.5.0
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
